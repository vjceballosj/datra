<mat-sidenav-container class="sidenav-container">
  <!-- Menú lateral -->
  <mat-sidenav #drawer mode="side" opened class="sidenav">
    <mat-toolbar color="primary" class="sidenav-header">
      <span>DATRA</span>
    </mat-toolbar>

    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active">
        <mat-icon>dashboard</mat-icon>
        <span>Dashboard</span>
      </a>

      <a mat-list-item routerLink="/lecturas" routerLinkActive="active">
        <mat-icon>sensors</mat-icon>
        <span>Lecturas PM130+</span>
      </a>

      <!-- Submenú de Pruebas -->
      <mat-expansion-panel [expanded]="true" class="submenu-panel">
        <mat-expansion-panel-header>
          <mat-panel-title>
            <mat-icon>assignment</mat-icon>
            <span>Pruebas a Realizar</span>
          </mat-panel-title>
        </mat-expansion-panel-header>

        <mat-nav-list>
          <a mat-list-item routerLink="/prueba-corto" routerLinkActive="active">
            <mat-icon>bolt</mat-icon>
            <span>Prueba de Corto Circuito</span>
          </a>

          <a mat-list-item routerLink="/prueba-vacio" routerLinkActive="active">
            <mat-icon>power</mat-icon>
            <span>Prueba de Vacío</span>
          </a>
        </mat-nav-list>
      </mat-expansion-panel>
    </mat-nav-list>
  </mat-sidenav>

  <!-- Contenido principal -->
  <mat-sidenav-content>
    <mat-toolbar color="primary" class="main-toolbar">
      <button mat-icon-button (click)="drawer.toggle()" class="menu-button">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-title">Sistema de Pruebas DATRA</span>
    </mat-toolbar>

    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
